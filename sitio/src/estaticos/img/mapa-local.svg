<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t">
  <title id="t">Mapa ilustrado: Mundo Motors en Av. Pellegrini 3971, Rosario, a metros de Lavalle y cerca de Bv. Avellaneda</title>
  <!-- Norte arriba. Calles según Google Maps; manzanas y lotes esquemáticos.
       Lo importante queda entre x=150 y x=650 para que no se recorte en escritorio. -->
  <defs>
    <pattern id="lotes-n" x="454" y="238" width="32" height="40" patternUnits="userSpaceOnUse"><rect width="30" height="40" fill="#E9EEF3"/></pattern>
    <pattern id="lotes-s" x="454" y="352" width="32" height="40" patternUnits="userSpaceOnUse"><rect width="30" height="40" fill="#E9EEF3"/></pattern>
  </defs>
  <rect width="800" height="520" fill="#E4EAF0"/>

  <!-- manzanas: todas iguales -->
  <g fill="#F4F7FA">
    <rect x="-10" y="-10" width="148" height="112" rx="6"/><rect x="222" y="-10" width="198" height="112" rx="6"/><rect x="450" y="-10" width="240" height="112" rx="6"/><rect x="720" y="-10" width="95" height="112" rx="6"/>
    <rect x="-10" y="132" width="148" height="148" rx="6"/><rect x="222" y="132" width="198" height="148" rx="6"/><rect x="450" y="132" width="240" height="148" rx="6"/><rect x="720" y="132" width="95" height="148" rx="6"/>
    <rect x="-10" y="350" width="148" height="140" rx="6"/><rect x="222" y="350" width="198" height="140" rx="6"/><rect x="450" y="350" width="240" height="140" rx="6"/><rect x="720" y="350" width="95" height="140" rx="6"/>
  </g>
  <!-- lotes sobre Av. Pellegrini -->
  <rect x="0" y="238" width="134" height="40" fill="url(#lotes-n)"/><rect x="226" y="238" width="190" height="40" fill="url(#lotes-n)"/><rect x="454" y="238" width="232" height="40" fill="url(#lotes-n)"/><rect x="724" y="238" width="76" height="40" fill="url(#lotes-n)"/>
  <rect x="0" y="352" width="134" height="40" fill="url(#lotes-s)"/><rect x="226" y="352" width="190" height="40" fill="url(#lotes-s)"/><rect x="454" y="352" width="232" height="40" fill="url(#lotes-s)"/><rect x="724" y="352" width="76" height="40" fill="url(#lotes-s)"/>

  <!-- Bv. Avellaneda (doble mano con cantero central) -->
  <rect x="150" y="0" width="60" height="520" fill="#FFFFFF"/>

  <!-- Av. Pellegrini -->
  <rect x="0" y="292" width="800" height="46" fill="#FFFFFF"/>
  <rect x="0" y="313" width="150" height="4" fill="#FBC08D"/>
  <rect x="210" y="313" width="590" height="4" fill="#FBC08D"/>
  <rect x="176" y="0" width="8" height="286" rx="4" fill="#DCE3EA"/>
  <rect x="176" y="344" width="8" height="176" rx="4" fill="#DCE3EA"/>

  <!-- el local: un lote a mitad de cuadra, del lado sur de Pellegrini, pasando Lavalle -->
  <rect x="518" y="352" width="30" height="40" fill="#FBC08D"/>

  <!-- nombres de calles -->
  <g font-family="Montserrat, Arial, sans-serif" font-weight="700" fill="#5F6B7A" letter-spacing="1" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">
    <text x="236" y="321" font-size="16">AV. PELLEGRINI</text>
    <text transform="translate(201.8 206) rotate(-90)" text-anchor="middle" font-size="13">BV. AVELLANEDA</text>
  </g>
  <g font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="1" fill="#7A8696">
    <text transform="translate(439.8 206) rotate(-90)" text-anchor="middle">LAVALLE</text>
    <text transform="translate(439.8 46) rotate(-90)" text-anchor="middle">LAVALLE</text>
    <text x="262" y="121.5">MONTEVIDEO</text>
    <text x="500" y="121.5">MONTEVIDEO</text>
  </g>

  <!-- pin -->
  <g transform="translate(533 242)">
    <ellipse cx="0" cy="110" rx="20" ry="6" fill="#0B376F" opacity=".2"/>
    <path d="M0 110 C-10 86 -40 66 -40 36 A40 40 0 0 1 40 36 C40 66 10 86 0 110Z" fill="#F47A20"/>
    <circle cx="0" cy="36" r="24" fill="#FFFFFF"/>
    <path d="M-13 47 V25 h7 l6 9 l9 -9 h4 v22 h-7 V36 l-6 6 l-6 -6 v11z" fill="#0B376F"/>
  </g>

  <!-- etiqueta -->
  <g transform="translate(423 410)">
    <path d="M110 -12 L122 0 L98 0 Z" fill="#0B376F"/>
    <rect width="220" height="62" rx="10" fill="#0B376F"/>
    <text x="110" y="27" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">MUNDO MOTORS</text>
    <text x="110" y="49" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="14" fill="#FBC08D">Av. Pellegrini 3971</text>
  </g>

  <!-- norte -->
  <g transform="translate(618 52)">
    <circle r="17" fill="#FFFFFF" stroke="#D5DDE5"/>
    <path d="M0 -26 L6 -16 L-6 -16 Z" fill="#F47A20"/>
    <text y="5" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="800" fill="#0B376F">N</text>
  </g>
</svg>
